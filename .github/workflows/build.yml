
       name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup App Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create dating_app --org com.datingapp.nearby
          cd dating_app
          flutter pub add geolocator
          cp ../../lib/main.dart lib/main.dart
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --debug
          mkdir -p ../../output
          cp build/app/outputs/flutter-apk/*.apk ../../output/dating-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dating-app-apk
          path: output/dating-app.apk
          
