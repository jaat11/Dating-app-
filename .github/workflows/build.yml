name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Packages
        run: flutter pub get || true

      - name: Build APK
        run: flutter build apk --split-per-abi || flutter build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dating-app-apk
          path: build/app/outputs/flutter
