name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup App Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create dating_app --org com.datingapp.nearby
          cd dating_app
          flutter pub add geolocator
          cp ../../lib/main.dart lib/main.dart
          flutter build apk --debug
          mkdir -p ../../output
          cp build/app/outputs/flutter-apk/*.apk ../../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dating-app-apk
          path: output/*.apk
          
